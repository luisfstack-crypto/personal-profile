baseURL: "https://luisfstack-crypto.github.io/personal-profile/"
languageCode: "en-us"
title: "Luis Alfonso Ek Pech - Personal Profile"
theme: "hugo-profile"

defaultContentLanguage: "en"
defaultContentLanguageInSubdir: false

languages:
  en:
    languageName: "English"
    weight: 1
    contentDir: "content"
  es:
    languageName: "Español"
    weight: 2
    contentDir: "content/es"

outputs:
  home:
    - "HTML"
    - "RSS"
    - "JSON"
  page:
    - "HTML"
    - "RSS"

enableRobotsTXT: true
pagination:
  pagerSize: 3

markup:
  goldmark:
    renderer:
      unsafe: true

params:
  title: "Hugo Profile"
  description: "Personal profile brand page"
  favicon: "/fav.png"
  useBootstrapCDN: false
  animate: true

  navbar:
    align: "ms-auto"
    brandName: "Luis Alfonso"
    disableSearch: false
    stickyNavBar:
      enable: true
      showOnScrollUp: true
    menus:
      disableAbout: false
      disableExperience: false
      disableEducation: false
      disableProjects: false
      disableAchievements: true
      disableContact: false

  hero:
    enable: true
    intro: "Hi, my name is"
    title: "Luis Alfonso."
    subtitle: "Software Developer"
    content: "Software developer, university student, and Linux Mint user passionate about building clean applications."
    image: "images/avatar.png"
    button:
      enable: true
      name: "Resume"
      url: "#"
      download: true
      newPage: false

  about:
    enable: true
    title: "About Me"
    image: "images/avatar.png"
    content: |-
      I am a software developer with a passion for web and mobile development. Currently pursuing full-stack engineering and optimizing workflows under Linux systems.
    skills:
      enable: true
      title: "Here are a few technologies I've been working with recently:"
      items:
        - "HTML / CSS"
        - "JavaScript"
        - "Laravel"
        - "Flutter"
        - "Python"

  contact:
    enable: true
    content: "My inbox is always open. Whether you have a question or just want to say hi, I’ll try my best to get back to you!"
    btnName: "Mail me"
    btnLink: "mailto:luisalfonsoep@example.com"
